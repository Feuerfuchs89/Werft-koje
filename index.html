<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Werftkoje – schlankes Boots-CAD: Rumpf vermessen und formen, Teile und Mechanik einbauen, Klassenmaße prüfen.">
<meta name="theme-color" content="#0c1820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Werftkoje">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Werftkoje</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: Vollbild-3D-Bootshalle. Rechts die Modell-Karteikarte (Klassenregeln, Ansicht, Lage, Steuerung), links das verschiebbare Werkstatt-Fenster (Rumpf · Teile · Mechanik · Projekt). Am Handy beide als umschaltbare Bodenleiste. Bewusst eine dunkle Werft-Optik. */
:root{
  --bg:#0c1820;--panel:rgba(14,30,40,.95);--field:#09141a;--ink:#e8eef0;--dim:#9db2bb;--rule:rgba(160,200,215,.2);
  --accent:#f2c230;--ok:#7fd49b;--bad:#ff8a78;--sel:rgba(242,194,48,.16);
  --f-disp:"Saira Condensed","Arial Narrow",sans-serif;--f-body:"Barlow","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-radius:10px}
.brand{font-family:var(--f-disp);font-weight:800;font-size:21px;letter-spacing:.04em;padding:0 6px 0 2px;line-height:1}
.brand b{color:var(--accent);font-weight:800}
.card{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.win{position:fixed;z-index:5;top:var(--wy,calc(env(safe-area-inset-top,0px) + 64px));left:var(--wx,max(12px,env(safe-area-inset-left,0px)));width:360px;max-height:calc(100% - 76px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
.win-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;cursor:move;user-select:none;touch-action:none}
.grip{color:var(--dim);font-size:12px;letter-spacing:2px}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;font:600 13px var(--f-body);color:var(--dim);background:transparent;border:0;border-bottom:2px solid transparent;padding:7px 2px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.win-b{overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:30px;letter-spacing:.03em;line-height:1;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--dim);letter-spacing:0;margin-top:4px}
.dims{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0;font-size:13px}
.dims dt{color:var(--dim)} .dims dd{margin:0;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.dims dd.ok{color:var(--ok)} .dims dd.bad{color:var(--bad)}
.lbl{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sub{font-family:var(--f-disp);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border-top:1px solid var(--rule);padding-top:10px;margin-top:4px}
.sub:first-child{border-top:0;padding-top:0;margin-top:0}
.grp{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button.v{font:600 13px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:7px;padding:5px 10px;cursor:pointer}
button.v:hover{border-color:var(--dim)}
button.v[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.v.ic{padding:5px 9px;font-size:15px;line-height:1}
button.v.pri{background:var(--accent);color:#14202a;border-color:var(--accent)}
button.v.warn{border-color:var(--bad);color:var(--bad)}
button.v:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;font-size:13px}
.sl output{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.sl input{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0}
.fld{display:grid;grid-template-columns:1fr 86px 30px;align-items:center;gap:2px 6px;font-size:13px}
.fld label{color:var(--dim);min-width:0}
.fld input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0 0 2px}
.fld2{display:grid;grid-template-columns:1fr 1.5fr;align-items:center;gap:6px;font-size:13px}
.fld2 label{color:var(--dim)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.u{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
input[type=number],input[type=text],select,textarea{font:500 12px var(--f-mono);color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:6px;padding:5px 6px;width:100%;min-width:0;box-sizing:border-box}
input[type=text]{font-family:var(--f-body);font-size:13px}
input[type=color]{width:40px;height:28px;padding:0;border:1px solid var(--rule);border-radius:6px;background:var(--field)}
textarea{min-height:90px;resize:vertical}
.plist{display:flex;flex-direction:column;gap:1px;max-height:210px;overflow:auto;border:1px solid var(--rule);border-radius:8px;padding:3px}
.plist button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;font:500 13px var(--f-body);color:var(--ink);background:transparent;border:0;border-radius:5px;padding:5px 8px;cursor:pointer}
.plist button span{color:var(--dim);font-size:11px;font-family:var(--f-mono);white-space:nowrap}
.plist button[aria-pressed="true"]{background:var(--sel);font-weight:600}
.plist button.kid{padding-left:22px}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border:1px solid var(--rule);border-radius:8px}
.mrow .full{grid-column:1 / -1}
.mrow label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim);min-width:0}
.note{font-size:12px;color:var(--dim);line-height:1.45;margin:0}
.live{font-family:var(--f-mono);font-size:12px;color:var(--ink);background:rgba(242,194,48,.08);border:1px solid rgba(242,194,48,.25);border-radius:7px;padding:6px 8px;line-height:1.55}
.res{font-family:var(--f-mono);font-size:12px;line-height:1.6}
.res .ok{color:var(--ok)} .res .bad{color:var(--bad)}
.ed{display:flex;flex-direction:column;gap:6px}
.edc{display:block;width:100%;height:230px;border:1px solid var(--rule);border-radius:8px;background:var(--field);touch-action:none;cursor:crosshair}
.edi{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end}
.edi label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim);min-width:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.amt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:4px;align-items:center}
.amt.amt3{grid-template-columns:repeat(2,minmax(0,1fr)) auto}
.amh{font-size:11px;color:var(--dim)}
.amt input{padding:4px}
.amt input.foc{border-color:var(--accent);background:rgba(242,194,48,.08)}
.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--ink);color:var(--bg);font:600 13px var(--f-body);padding:8px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--rule);border-radius:8px}
.prow b{font-weight:600}.prow span{display:block;font-size:11px;color:var(--dim);font-family:var(--f-mono)}
.hint{position:fixed;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:12px;color:var(--dim);background:rgba(12,24,32,.7);padding:5px 9px;border-radius:7px}
.card,.win{resize:both;min-width:240px;min-height:120px}
.handle{display:none}
.pull{display:none;width:44px;height:5px;border-radius:3px;background:var(--dim);opacity:.7}
@media (max-width:720px){
  .card,.win{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;height:var(--sh,42%);max-height:none;min-height:0;min-width:0;resize:none}
  .card{padding:0 14px 14px}
  .handle{display:flex;justify-content:center;align-items:center;position:sticky;top:0;z-index:3;height:26px;margin:0 -14px -4px;background:var(--panel);touch-action:none;cursor:ns-resize;flex:none}
  .pull{display:block}
  .win-h{cursor:ns-resize;flex-direction:column;gap:6px;padding-top:8px}
  .win-h .grip{display:none}
  h1{font-size:24px} .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div id="stage"></div>

<nav class="bar panel" id="bar" aria-label="Werkzeugleiste">
  <span class="brand">Werft<b>koje</b></span>
  <button class="v" id="bWerk" aria-pressed="true">Werkstatt</button>
  <button class="v" id="bModell" aria-pressed="true">Modell</button>
  <button class="v ic" id="bUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
  <button class="v ic" id="bLock" aria-pressed="false" title="Messpunkte gegen Verschieben sperren" aria-label="Messpunkte sperren">🔓</button>
  <button class="v pri" id="bSave" title="Speichern (Strg+S)">Speichern</button>
  <button class="v ic" id="bRedo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen">↷</button>
</nav>

<section class="win panel" id="win" aria-label="Werkstatt">
  <header class="win-h" id="winH" title="Ziehen: Größe ändern · Tippen: ein-/ausklappen"><span class="pull" aria-hidden="true"></span><span class="lbl">Werkstatt</span><span class="grip" aria-hidden="true">⠿ verschieben</span></header>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="rumpf" aria-selected="false">Rumpf</button>
    <button role="tab" data-tab="teile" aria-selected="true">Teile</button>
    <button role="tab" data-tab="linien" aria-selected="false">Linien</button>
    <button role="tab" data-tab="mechanik" aria-selected="false">Mechanik</button>
    <button role="tab" data-tab="projekt" aria-selected="false">Projekt</button>
  </div>
  <div class="win-b" id="winB"></div>
</section>

<aside class="card panel" id="card" aria-label="Modell">
  <div class="handle" id="cardH" title="Ziehen: Größe ändern · Tippen: ein-/ausklappen"><span class="pull" aria-hidden="true"></span></div>
  <h1 id="pName">Marblehead<small id="pSub"></small></h1>
  <dl class="dims" id="regeln"></dl>
  <div class="grp"><span class="lbl">Ansicht</span>
    <div class="row" id="views">
      <button class="v" data-view="side" aria-pressed="false">Seite</button><button class="v" data-view="bow" aria-pressed="false">Bug</button><button class="v" data-view="stern" aria-pressed="false">Heck</button><button class="v" data-view="top" aria-pressed="false">Oben</button><button class="v" data-view="under" aria-pressed="false">Unterwasser</button><button class="v" data-view="free" aria-pressed="true">Frei</button>
    </div>
    <div class="row"><button class="v" id="tOrtho" aria-pressed="false" title="Ohne Perspektive, wie eine Bauzeichnung">Parallelansicht</button></div>
  </div>
  <div class="grp"><span class="lbl">Lage im Wasser</span>
    <label class="sl" for="lHoehe">Höhe über Wasser <output id="lHoeheO"></output><input type="range" id="lHoehe"></label>
    <label class="sl" for="lHeel">Krängung <output id="lHeelO"></output><input type="range" id="lHeel" min="-30" max="45" step="1"></label>
    <label class="sl" for="lTrim">Trimm (+ = Bug hoch) <output id="lTrimO"></output><input type="range" id="lTrim" min="-15" max="15" step="0.5"></label>
    <div class="row"><button class="v" id="tAnim" aria-pressed="false">Wellen</button></div>
  </div>
  <div class="grp"><span class="lbl">Steuerung</span><div class="grp" id="steuerBox"></div></div>
  <div class="live" id="live" aria-live="polite"></div>
  <div class="grp"><span class="lbl">Einblenden</span>
    <div class="row"><button class="v" id="tSail" aria-pressed="true">Segel</button><button class="v" id="tMech" aria-pressed="true">Gestänge</button><button class="v" id="tWater" aria-pressed="true">Wasser</button><button class="v" id="tDims" aria-pressed="true">Maße</button><button class="v" id="tGrid" aria-pressed="true">Raster</button><button class="v" id="tLines" aria-pressed="true">Linien</button><button class="v" id="tSee" aria-pressed="false" title="Rumpf durchsichtig, um innen zu planen">Durchsicht</button></div></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="hint">Ziehen = drehen · Mausrad = zoomen · Rechtsklick = verschieben · Klick auf ein Teil = bearbeiten</div>

 return R.map(r=>{if(!isFinite(r.min))return esc(r.v.name)+': Anker fehlt';const dl=r.max-r.min;
  if(r.v.art==='stange'){const c=dl<0.5?'ok':'bad';const t=dl<0.5?'✓ bleibt gleich lang':dl<2?'△ ändert sich leicht':'✗ klemmt';return esc(r.v.name)+': '+mm((r.min+r.max)/2)+' · Δ '+fmtN(dl,1)+' mm <span class="'+c+'">'+t+'</span>';}

function loadTpl(k){flush();P=normalize(TEMPLATES[k]());sel=null;commit();needRebuild=true;renderAll();setTimeout(()=>goView('free'),50);}

/* ================= Modell-Karte ================= */
const MESS=[['loa','Länge über alles'],['breite','Breite'],['tiefgang','Tiefgang'],['hoehe','Höhe über Deck'],['segel','Segelfläche']];
function renderRegeln(){const K=KLASSEN[P.klasse],box=$('regeln');box.textContent='';
 for(const [k,lab] of MESS){const lim=K.regeln[k],v=M[k];const ok=lim==null||v<=lim+0.5;const f=x=>k==='segel'?area(x):mm(x);
  box.append(el('dt',{text:lab}),el('dd',{class:lim==null?'':(ok?'ok':'bad'),text:f(v)+(lim!=null?' / '+f(lim)+(ok?' ✓':' ✗'):'')}));}}
function renderLive(){const out=[];
 for(const id in built){const p=built[id].p;if((p.typ==='fuehler'&&p.auto)||(p.antrieb&&p.antrieb.quelle))out.push(esc(p.name)+' '+deg(ANG[id]||0));}
 for(const v of P.verbindungen)if(LEN[v.id]!=null)out.push(esc(v.name)+' '+mm(LEN[v.id]));
 out.push('Gewicht '+gram(M.masse)+(M.masse>0?' · Schwerpunkt '+mm(M.cgx)+' ab Bug, '+mm(Math.abs(M.cgy))+(M.cgy<0?' unter':' über')+' WL':''));
 $('live').innerHTML=out.join('<br>');}
const fmtSt=s=>fmtN(s.wert,Math.abs(s.max-s.min)<20?1:0)+' '+(s.einheit||'');
function renderSteuer(){const box=$('steuerBox');box.textContent='';if(!P.steuer.length){box.append(note('Noch keine Steuerwerte. In der Werkstatt unter Mechanik anlegen.'));return;}
 for(const s of P.steuer){const id='st-'+s.id;const o=el('output',{for:id,text:fmtSt(s)});const r=el('input',{type:'range',id,min:s.min,max:s.max,step:(s.max-s.min)/200||0.1,value:s.wert});
  r.addEventListener('input',()=>{s.wert=+r.value;o.textContent=fmtSt(s);changed('drive');});box.append(el('label',{class:'sl',for:id},s.name+' ',o,r));}}
function renderLage(){const l=P.lage,h=$('lHoehe');h.min=l.hMin;h.max=l.hMax;h.step=Math.max(1,Math.round((l.hMax-l.hMin)/200));h.value=l.hoehe;$('lHoeheO').textContent=mm(l.hoehe);$('lHeel').value=l.kraengung;$('lHeelO').textContent=fmtN(l.kraengung,0)+'°';$('lTrim').value=l.trimm;$('lTrimO').textContent=deg(+l.trimm);}
$('lHoehe').addEventListener('input',e=>{P.lage.hoehe=+e.target.value;animBase=P.lage.hoehe;$('lHoeheO').textContent=mm(P.lage.hoehe);changed('drive');});
$('lHeel').addEventListener('input',e=>{P.lage.kraengung=+e.target.value;$('lHeelO').textContent=fmtN(P.lage.kraengung,0)+'°';changed('drive');});
$('lTrim').addEventListener('input',e=>{P.lage.trimm=+e.target.value;$('lTrimO').textContent=deg(P.lage.trimm);changed('drive');});
function renderCard(){$('pName').firstChild.textContent=P.name;$('pSub').textContent=KLASSEN[P.klasse].name+' · Rumpf '+mm(P.rumpf.L);renderLage();renderSteuer();}
function renderAll(){renderCard();renderWin();}

/* ================= Start & Schleife ================= */
if(mobile()){$('win').hidden=true;$('bWerk').setAttribute('aria-pressed',false);}
resize();renderAll();updUndo();
let first=true,last=performance.now();
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(anim&&!reduce){animT+=dt;const amp=(P.lage.hMax-P.lage.hMin)*0.08;P.lage.hoehe=clamp(animBase+amp*Math.sin(animT*1.3)+amp*0.45*Math.sin(animT*3.1),P.lage.hMin,P.lage.hMax);needApply=true;}
 if(needRebuild){needRebuild=false;rebuild();needApply=true;}
 if(needApply){needApply=false;applyDrives();measure();updDims();applyToggles();renderRegeln();renderLive();if(first){first=false;goView('free',true);}}
 if(fly){fly.k=Math.min(1,fly.k+dt*(reduce?10:1.6));const e=fly.k<0.5?2*fly.k*fly.k:1-Math.pow(-2*fly.k+2,2)/2;cam.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(fly.k>=1)fly=null;}
 if(sel&&partMeshes[sel]){selBox.makeEmpty();for(const m of partMeshes[sel])selBox.expandByObject(m);selHelper.visible=!selBox.isEmpty();}else selHelper.visible=false;
 controls.update();renderer.render(scene,cam);})(last);
</script>

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
