<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Werftkoje – schlankes Boots-CAD: Rumpf vermessen und formen, Teile und Mechanik einbauen, Klassenmaße prüfen.">
<meta name="theme-color" content="#0c1820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Werftkoje">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<title>Werftkoje</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: Vollbild-3D-Bootshalle. Rechts die Modell-Karteikarte (Klassenregeln, Ansicht, Lage, Steuerung), links das verschiebbare Werkstatt-Fenster (Rumpf · Teile · Mechanik · Projekt). Am Handy beide als umschaltbare Bodenleiste. Bewusst eine dunkle Werft-Optik. */
:root{
  --bg:#0c1820;--panel:rgba(14,30,40,.95);--field:#09141a;--ink:#e8eef0;--dim:#9db2bb;--rule:rgba(160,200,215,.2);
  --accent:#f2c230;--ok:#7fd49b;--bad:#ff8a78;--sel:rgba(242,194,48,.16);
  --f-disp:"Saira Condensed","Arial Narrow",sans-serif;--f-body:"Barlow","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-radius:10px}
.brand{font-family:var(--f-disp);font-weight:800;font-size:21px;letter-spacing:.04em;padding:0 6px 0 2px;line-height:1}
.brand b{color:var(--accent);font-weight:800}
.card{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.win{position:fixed;z-index:5;top:var(--wy,calc(env(safe-area-inset-top,0px) + 64px));left:var(--wx,max(12px,env(safe-area-inset-left,0px)));width:360px;max-height:calc(100% - 76px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
.win-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;cursor:move;user-select:none;touch-action:none}
.grip{color:var(--dim);font-size:12px;letter-spacing:2px}
.tabs{display:flex;flex:none;gap:2px;padding:0 8px;border-bottom:1px solid var(--rule);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.win-h{flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;font:600 12.5px var(--f-body);color:var(--dim);background:transparent;border:0;border-bottom:2px solid transparent;padding:7px 5px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.win-b{overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.win-b>*{flex-shrink:0}
h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:30px;letter-spacing:.03em;line-height:1;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--dim);letter-spacing:0;margin-top:4px}
.dims{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0;font-size:13px}
.dims dt{color:var(--dim)} .dims dd{margin:0;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.dims dd.ok{color:var(--ok)} .dims dd.bad{color:var(--bad)}
.lbl{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sub{font-family:var(--f-disp);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border-top:1px solid var(--rule);padding-top:10px;margin-top:4px}
.sub:first-child{border-top:0;padding-top:0;margin-top:0}
.grp{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button.v{font:600 13px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:7px;padding:5px 10px;cursor:pointer}
button.v:hover{border-color:var(--dim)}
button.v[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.v.ic{padding:5px 9px;font-size:15px;line-height:1}
button.v.pri{background:var(--accent);color:#14202a;border-color:var(--accent)}
button.v.warn{border-color:var(--bad);color:var(--bad)}
button.v:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;font-size:13px}
.sl output{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.sl input{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0}
.fld{display:grid;grid-template-columns:1fr 86px 30px;align-items:center;gap:2px 6px;font-size:13px}
.fld label{color:var(--dim);min-width:0}
.fld input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0 0 2px}
.fld2{display:grid;grid-template-columns:1fr 1.5fr;align-items:center;gap:6px;font-size:13px}
.fld2 label{color:var(--dim)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.u{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
input[type=number],input[type=text],select,textarea{font:500 12px var(--f-mono);color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:6px;padding:5px 6px;width:100%;min-width:0;box-sizing:border-box}
input[type=text]{font-family:var(--f-body);font-size:13px}
input[type=color]{width:40px;height:28px;padding:0;border:1px solid var(--rule);border-radius:6px;background:var(--field)}
textarea{min-height:90px;resize:vertical}
.plist{display:flex;flex-direction:column;gap:1px;max-height:210px;overflow:auto;border:1px solid var(--rule);border-radius:8px;padding:3px}
.plist button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;font:500 13px var(--f-body);color:var(--ink);background:transparent;border:0;border-radius:5px;padding:5px 8px;cursor:pointer}
.plist button span{color:var(--dim);font-size:11px;font-family:var(--f-mono);white-space:nowrap}
.plist button[aria-pressed="true"]{background:var(--sel);font-weight:600}
.plist button.kid{padding-left:22px}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border:1px solid var(--rule);border-radius:8px}
.mrow .full{grid-column:1 / -1}
.mrow label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim);min-width:0}
.note{font-size:12px;color:var(--dim);line-height:1.45;margin:0}
.live{font-family:var(--f-mono);font-size:12px;color:var(--ink);background:rgba(242,194,48,.08);border:1px solid rgba(242,194,48,.25);border-radius:7px;padding:6px 8px;line-height:1.55}
.res{font-family:var(--f-mono);font-size:12px;line-height:1.6}
.res .ok{color:var(--ok)} .res .bad{color:var(--bad)}
.ed{display:flex;flex-direction:column;gap:6px}
.ki-l{display:flex;flex-direction:column;gap:6px;max-height:340px;min-height:90px;overflow-y:auto;padding:6px;border:1px solid var(--rule);border-radius:8px;background:var(--field)}
.ki-b{border-radius:8px;padding:7px 9px;font-size:13px;line-height:1.45;max-width:92%}
.ki-u{align-self:flex-end;background:var(--sel)}
.ki-a{align-self:flex-start;background:rgba(232,238,240,.06);border:1px solid var(--rule)}
.ki-f{border-color:#f2a03d}
.ki-t{white-space:pre-wrap;overflow-wrap:anywhere}
.ki-m{font-size:11px;color:var(--dim);margin-bottom:3px}
.ki-ops{margin:6px 0;padding-left:18px;font:500 12px var(--f-mono);color:var(--ink)}
.ki-ops li{margin:2px 0}
.kifab{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 54px);display:flex;align-items:center;gap:8px;padding:10px 18px 10px 14px;border:0;border-radius:999px;cursor:pointer;
 font:700 14px var(--f-body);color:#fff;background:linear-gradient(135deg,#6d4cff,#b43fd6);box-shadow:0 6px 22px rgba(109,76,255,.45),0 0 0 1px rgba(255,255,255,.18) inset;transition:transform .15s,box-shadow .15s}
.kifab:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 10px 28px rgba(109,76,255,.6),0 0 0 1px rgba(255,255,255,.25) inset}
.kifab:focus-visible{outline:2px solid #fff;outline-offset:3px}
.kifab[aria-pressed="true"]{background:linear-gradient(135deg,#4b33b8,#7d2c96)}
.kifab-i{font-size:17px;line-height:1}
.kifab-s{display:none;font:600 11px var(--f-mono);background:rgba(255,255,255,.22);border-radius:999px;padding:2px 7px}
.kifab-s:not(:empty){display:inline-block}
.kifab.denkt .kifab-i{animation:kidreh 1.2s linear infinite}
@keyframes kidreh{to{transform:rotate(360deg)}}
.tabs .tab-ki{margin-left:6px;color:#b9a6ff;border-left:1px solid var(--rule)!important;padding-left:10px}
.tabs .tab-ki[aria-selected="true"]{color:#d9ceff;border-bottom-color:#8b6cff}
@media (max-width:720px){.kifab{left:auto;right:max(14px,env(safe-area-inset-right,0px));transform:none;top:auto;bottom:calc(var(--sh,42%) + env(safe-area-inset-bottom,0px) + 22px);padding:12px 14px}.kifab:hover{transform:none}.kifab-t{display:none}}
@media (prefers-reduced-motion:reduce){.kifab.denkt .kifab-i{animation:none}}
.edc{display:block;width:100%;height:230px;border:1px solid var(--rule);border-radius:8px;background:var(--field);touch-action:none;cursor:crosshair}
.edi{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end}
.edi label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim);min-width:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.amt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:4px;align-items:center}
.amt.amt3{grid-template-columns:repeat(2,minmax(0,1fr)) auto}
.amh{font-size:11px;color:var(--dim)}
.amt input{padding:4px}
.amt input.foc{border-color:var(--accent);background:rgba(242,194,48,.08)}
.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--ink);color:var(--bg);font:600 13px var(--f-body);padding:8px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--rule);border-radius:8px}
.prow b{font-weight:600}.prow span{display:block;font-size:11px;color:var(--dim);font-family:var(--f-mono)}
.hint{position:fixed;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:12px;color:var(--dim);background:rgba(12,24,32,.7);padding:5px 9px;border-radius:7px}
.card,.win{resize:both;min-width:240px;min-height:120px}
.handle{display:none}
.pull{display:none;width:44px;height:5px;border-radius:3px;background:var(--dim);opacity:.7}
@media (max-width:720px){
  .card,.win{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;height:var(--sh,42%);max-height:none;min-height:0;min-width:0;resize:none}
  .card{padding:0 14px 14px}
  .handle{display:flex;justify-content:center;align-items:center;position:sticky;top:0;z-index:3;height:26px;margin:0 -14px -4px;background:var(--panel);touch-action:none;cursor:ns-resize;flex:none}
  .pull{display:block}
  .win-h{cursor:ns-resize;flex-direction:column;gap:6px;padding-top:8px}
  .win-h .grip{display:none}
  h1{font-size:24px} .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage"></div>

<nav class="bar panel" id="bar" aria-label="Werkzeugleiste">
  <span class="brand">Werft<b>koje</b></span>
  <button class="v" id="bWerk" aria-pressed="true">Werkstatt</button>
  <button class="v" id="bModell" aria-pressed="true">Modell</button>
  <button class="v ic" id="bUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
  <button class="v ic" id="bLock" aria-pressed="false" title="Messpunkte gegen Verschieben sperren" aria-label="Messpunkte sperren">🔓</button>
  <button class="v ic" id="bRahmen" aria-pressed="false" title="Rahmenauswahl: im 3D-Bild einen Rahmen um mehrere Teile ziehen" aria-label="Rahmenauswahl">▭</button>
  <button class="v ic" id="bSym" aria-pressed="false" title="Symmetrie: Änderungen laufen auf dem gespiegelten Gegenstück mit" aria-label="Symmetrie">⇋</button>
  <button class="v pri" id="bSave" title="Speichern (Strg+S)">Speichern</button>
  <button class="v ic" id="bRedo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen">↷</button>
</nav>
<button class="kifab" id="bKI" type="button" aria-pressed="false" title="KI-Assistent öffnen (Taste K)" aria-label="KI-Assistent"><span class="kifab-i" aria-hidden="true">✦</span><span class="kifab-t">KI-Assistent</span><span class="kifab-s" id="bKIs"></span></button>

<section class="win panel" id="win" aria-label="Werkstatt">
  <header class="win-h" id="winH" title="Ziehen: Größe ändern · Tippen: ein-/ausklappen"><span class="pull" aria-hidden="true"></span><span class="lbl">Werkstatt</span><span class="grip" aria-hidden="true">⠿ verschieben</span></header>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="rumpf" aria-selected="false">Rumpf</button>
    <button role="tab" data-tab="teile" aria-selected="true">Teile</button>
    <button role="tab" data-tab="linien" aria-selected="false">Linien</button>
    <button role="tab" data-tab="rechnen" aria-selected="false">Rechnen</button>
    <button role="tab" data-tab="mechanik" aria-selected="false">Mechanik</button>
    <button role="tab" data-tab="projekt" aria-selected="false">Projekt</button>
    <button role="tab" data-tab="ki" aria-selected="false" class="tab-ki">✦ KI</button>
  </div>
  <div class="win-b" id="winB"></div>
</section>

<aside class="card panel" id="card" aria-label="Modell">
  <div class="handle" id="cardH" title="Ziehen: Größe ändern · Tippen: ein-/ausklappen"><span class="pull" aria-hidden="true"></span></div>
  <h1 id="pName">Marblehead<small id="pSub"></small></h1>
  <dl class="dims" id="regeln"></dl>
  <div class="grp"><span class="lbl">Ansicht</span>
    <div class="row" id="views">
      <button class="v" data-view="side" aria-pressed="false">Seite</button><button class="v" data-view="bow" aria-pressed="false">Bug</button><button class="v" data-view="stern" aria-pressed="false">Heck</button><button class="v" data-view="top" aria-pressed="false">Oben</button><button class="v" data-view="under" aria-pressed="false">Unterwasser</button><button class="v" data-view="free" aria-pressed="true">Frei</button>
    </div>
    <div class="row"><button class="v" id="tOrtho" aria-pressed="false" title="Ohne Perspektive, wie eine Bauzeichnung">Parallelansicht</button></div>
  </div>
  <div class="grp"><span class="lbl">Lage im Wasser</span>
    <label class="sl" for="lHoehe">Höhe über Wasser <output id="lHoeheO"></output><input type="range" id="lHoehe"></label>
    <label class="sl" for="lHeel">Krängung <output id="lHeelO"></output><input type="range" id="lHeel" min="-30" max="45" step="1"></label>
    <label class="sl" for="lTrim">Trimm (+ = Bug hoch) <output id="lTrimO"></output><input type="range" id="lTrim" min="-15" max="15" step="0.5"></label>
    <div class="row"><button class="v" id="tAnim" aria-pressed="false">Wellen</button></div>
  </div>
  <div class="grp"><span class="lbl">Steuerung</span><div class="grp" id="steuerBox"></div></div>
  <div class="live" id="live" aria-live="polite"></div>
  <div class="grp"><span class="lbl">Einblenden</span>
    <div class="row"><button class="v" id="tSail" aria-pressed="true">Segel</button><button class="v" id="tMech" aria-pressed="true">Gestänge</button><button class="v" id="tWater" aria-pressed="true">Wasser</button><button class="v" id="tDims" aria-pressed="true">Maße</button><button class="v" id="tGrid" aria-pressed="true">Raster</button><button class="v" id="tLines" aria-pressed="true">Linien</button><button class="v" id="tSee" aria-pressed="false" title="Rumpf durchsichtig, um innen zu planen">Durchsicht</button></div></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="hint">Ziehen = drehen · Mausrad = zoomen · Rechtsklick = verschieben · Klick auf ein Teil = bearbeiten</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
/* ================= Grundlagen ================= */
const DEG=Math.PI/180,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const NS=80,NB=8,NT=4; // Rumpfauflösung: Stationen, Boden- und Seitenpunkte
const $=id=>document.getElementById(id);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null)continue;if(k.startsWith('aria-')){e.setAttribute(k,String(v));continue;}if(v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}for(const c of kids)if(c!=null)e.append(c);return e;}
const fmtN=(v,d=0)=>(+v).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const mm=v=>fmtN(Math.round(v))+' mm';
const deg=v=>(v>0.05?'+':'')+fmtN(v,1)+'°';
const area=c=>c>=10000?fmtN(c/10000,2)+' m²':fmtN(Math.round(c))+' cm²';
const gram=g=>g>=10000?fmtN(g/1000,1)+' kg':fmtN(Math.round(g))+' g';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uidN=0;const uid=()=>'t'+Date.now().toString(36).slice(-5)+(uidN++).toString(36);

/* ================= Datenmodell & Vorlagen ================= */
/* Koordinaten in mm: x = Abstand vom Bug, y = Höhe über Wasserlinie, s = seitlich (+ = Steuerbord). Winkel in Grad. */
const TYPEN={profil:'Profil',bombe:'Bombe / Körper',rohr:'Rohr / Stab',kasten:'Kasten',servo:'Servo / Winde',segel:'Segel',fuehler:'Fühler (Wand)',platte:'Platte / Netz',kiel:'Kiel / Steven',aufbau:'Aufbau (Kajüte, Süll)',ausschnitt:'Ausschnitt / Öffnung'};

 const dAt=u=>{const hm=+p.hoehe||0,hs=p.hoeheSteven==null?hm:+p.hoeheSteven,hh=p.hoeheHeck==null?hm:+p.hoeheHeck;return (u<0.2?hs+(hm-hs)*sstep(0,0.2,u):hm+(hh-hm)*sstep(0.85,1,u))/1000;};

 const pos=[],idx=[];
 for(let i=0;i<=N;i++){const a=pts[Math.max(0,i-1)],c=pts[Math.min(N,i+1)];let tz=c[0]-a[0],ty=c[1]-a[1];const l=Math.hypot(tz,ty)||1;tz/=l;ty/=l;
  const nz=ty,ny=-tz,d=dAt(i/N),[z,y]=pts[i];// Normale nach außen (unten bzw. vorn)
  pos.push(-b,y+0.0005,z, b,y+0.0005,z, b,y+ny*d,z+nz*d, -b,y+ny*d,z+nz*d);}

const ankerVec=p=>V((p.anker[2]||0)/1000,(p.anker[1]||0)/1000,(p.anker[0]||0)/1000);

function deckY(x,s){const d=hdims(x/P.rumpf.L),q=d.B>0?clamp(s/1000/d.B,-1,1):1;return (d.Ys+deckBucht(x/P.rumpf.L,d)*(1-q*q))*1000+1.5;}

/* ================= Rechnen: übernommen aus dem NACA Multi-Spanten & Rigg CAD Tool (Python) =================
   Hydrostatik (Verdrängung, Schwimmlage, LCB/VCB, Spantflächenkurve), Lateralplan/Segelschwerpunkt/Vorlauf,
   Kielbombe aus Masse, Laminat- und Harzbedarf, Exporte (OBJ/STL/DXF) und 1:1-Schablonen (SVG). */
const BOMBEN={
 torpedo:{name:'Torpedo (schlank, strömungsoptimiert)',nase:0.38,heck:1.75,text:'Kurzer, rund-stumpfer Bug, langes, fein auslaufendes Heck. Guter Allrounder.'},
 bauchig:{name:'Bulb (bauchig, Scheimann-Form)',nase:0.25,heck:2.4,text:'Dickster Punkt weit vorn, sehr voller Bug, kurzes Heck. Viel Masse auf kurzer Länge.'},
 zigarre:{name:'Zigarrenform (symmetrisch)',nase:0.5,heck:2.0,text:'Vorn und hinten fast gleich. Einfach zu bauen, etwas mehr Widerstand.'},
 lang:{name:'Langgestreckt (schlankes Heck)',nase:0.45,heck:1.3,text:'Sehr weiches, langes Heck. Wenig Formwiderstand, baulich anspruchsvoll.'}};
const bombeK=p=>{const n=+(p.formNase??0.38),t=+(p.formHeck??1.75);return n*2/3+(1-n)/(2*t+1);};
const RECHNEN_DEF={wasser:'suess',zielKg:null,vorlaufZiel:5,kern:0,harz:'hand',marker:true,
 laminat:[{material:'Glasgewebe',gramm:160,winkel:45,lagen:2},{material:'Carbongelege',gramm:300,winkel:0,lagen:2},{material:'Glasgewebe',gramm:160,winkel:-45,lagen:1}],teile:null};
const RC=()=>{if(!P.rechnen)P.rechnen=JSON.parse(JSON.stringify(RECHNEN_DEF));for(const k in RECHNEN_DEF)if(P.rechnen[k]===undefined)P.rechnen[k]=JSON.parse(JSON.stringify(RECHNEN_DEF[k]));return P.rechnen;};
const lamDicke=l=>(+l.gramm||0)/1000*(+l.lagen||0)*0.8; // mm je Lage-Paket
const lamSumme=()=>RC().laminat.reduce((a,l)=>a+lamDicke(l),0);

/* ---- NACA-Profil ---- */
function nacaParse(code){const c=String(code||'').trim().replace(',','.');if(c.length<4||!/^\d\d[\d.]+$/.test(c))return null;const m=+c[0]/100,p=+c[1]/10,t=parseFloat(c.slice(2))/100;
 return isFinite(t)&&t>=0.001&&t<=0.4?{m,p,t}:null;}
const profN=p=>nacaParse(p.naca)||{m:0,p:0,t:Math.max(0.005,(+p.dicke||10)/100)};
function nacaAt(N,x,teRel){let yt=5*N.t*(0.2969*Math.sqrt(x)-0.126*x-0.3516*x*x+0.2843*x*x*x-0.1036*x*x*x*x);if(teRel>0&&x>0.5)yt=Math.max(yt,teRel/2);
 let yc=0,dy=0;if(N.m>0&&N.p>0){if(x<=N.p){yc=N.m/(N.p*N.p)*(2*N.p*x-x*x);dy=2*N.m/(N.p*N.p)*(N.p-x);}else{yc=N.m/((1-N.p)**2)*((1-2*N.p)+2*N.p*x-x*x);dy=2*N.m/((1-N.p)**2)*(N.p-x);}}return [yc,yt,Math.atan(dy)];}
// geschlossene Kontur in Sehnen-Einheiten: [x längs, y quer]; inset (relativ) verkleinert die Dicke (Laminat innen)
function nacaLoop(N,np,teRel,inset){const o=[];for(let j=0;j<np;j++){const a=2*Math.PI*j/np,x=(1+Math.cos(a))/2,up=Math.sin(a)>=0;let [yc,yt,th]=nacaAt(N,x,teRel);if(inset)yt=Math.max(0,yt-inset);
 o.push(up?[x-yt*Math.sin(th),yc+yt*Math.cos(th)]:[x+yt*Math.sin(th),yc-yt*Math.cos(th)]);}return o;}
const profChord=(p,k)=>profAt(p,k).ch; // mm, berücksichtigt Stationen
function profUmfang(p,k){const at=profAt(p,k),ch=at.ch,L=nacaLoop(at.N,80,at.te/Math.max(1,ch));let s=0;for(let i=0;i<L.length;i++){const a=L[i],b=L[(i+1)%L.length];s+=Math.hypot(a[0]-b[0],a[1]-b[1]);}return s*ch;}
function profOberflaeche(p){let A=0;const n=12;for(let i=0;i<n;i++)A+=(profUmfang(p,i/n)+profUmfang(p,(i+1)/n))/2*(+p.spann)/n;return A/1e6;} // m²

/* ---- Hydrostatik ---- */
const rho=()=>RC().wasser==='salz'?1.025:1.000;
function hullSec(u,M=36){const d=hdims(u),ex=0.5+0.5*clamp(P.rumpf.boden/100,0,1),f=secAt(u,d,ex),o=[];for(let j=0;j<=M;j++){const [b,y]=f(j/M);o.push([y*1000,b*1000]);}return o;} // [Höhe, ½ Breite] mm
function secUnter(pts,z){let A=0,My=0;for(let i=1;i<pts.length;i++){let [y0,b0]=pts[i-1],[y1,b1]=pts[i];if(y0>=z)break;if(y1>z){b1=b0+(b1-b0)*(z-y0)/((y1-y0)||1);y1=z;}const dy=y1-y0;if(dy<=0)continue;const a=(b0+b1)*dy;A+=a;My+=a*(y0+y1)/2;}return [A,My];}
function anhaenge(zw){const out=[];for(const id in built){const p=built[id].p;
  if(p.typ==='bombe'){const V=Math.PI*bombeK(p)*p.laenge*(p.durchm/2)**2;if(p.y<zw)out.push({V,x:p.x,y:p.y});}
  else if(p.typ==='profil'&&p.lage!=='waagerecht'){const n=10;for(let i=0;i<n;i++){const k=(i+0.5)/n,y=p.y-k*p.spann;if(y>=zw)continue;const at=profAt(p,k),ch=at.ch;out.push({V:0.685*at.N.t*ch*ch*p.spann/n,x:p.x+profLE(p,k)+0.42*ch,y});}}
  else if(p.typ==='kiel'){const n=60,L=P.rumpf.L;for(let i=0;i<n;i++){const u=(i+0.5)/n,d=(+p.hoehe||0),y=hdims(u).Yk*1000-d/2;if(y<zw)out.push({V:(+p.breite||0)*d*L/n,x:u*L,y});}}}
 return out;}
function hydro(zw){const N=80,L=P.rumpf.L,dx=L/N,sac=[];let V=0,Mx=0,Mz=0,x0=Infinity,x1=-Infinity,bwl=0;
 for(let i=0;i<=N;i++){const u=i/N,x=u*L,pts=hullSec(u),[A,My]=secUnter(pts,zw),w=(i===0||i===N)?0.5:1;sac.push([x,A]);V+=A*w*dx;Mx+=A*x*w*dx;Mz+=My*w*dx;
  if(A>1){x0=Math.min(x0,x);x1=Math.max(x1,x);}for(let k=1;k<pts.length;k++)if(pts[k-1][0]<=zw&&pts[k][0]>=zw){const t=(zw-pts[k-1][0])/((pts[k][0]-pts[k-1][0])||1);bwl=Math.max(bwl,2*(pts[k-1][1]+t*(pts[k][1]-pts[k-1][1])));}}
 for(const a of anhaenge(zw)){V+=a.V;Mx+=a.V*a.x;Mz+=a.V*a.y;}
 const Vm3=V/1e9;return {zw,V:Vm3,kg:Vm3*1000*rho(),lcb:V>0?Mx/V:0,vcb:V>0?Mz/V:zw,lwl:x1>x0?x1-x0:0,bwl,sac};}
function tiefsterPunkt(){return M?M.box.min.y*1000:-P.rumpf.T;}
function schwimmlage(kg){let lo=tiefsterPunkt(),hi=Math.max(...[0,0.25,0.5,0.75,1].map(u=>hdims(u).Ys*1000));
 const hlo=hydro(lo),hhi=hydro(hi);if(kg<=hlo.kg)return {h:hlo,warn:'Das Gewicht ist so klein, dass das Boot schon am tiefsten Punkt schwimmt.'};
 if(kg>=hhi.kg)return {h:hhi,warn:'Das Gewicht übersteigt die Verdrängung bis zur Deckskante – das Boot würde sinken.'};
 let h=hhi;for(let k=0;k<50;k++){const mid=(lo+hi)/2;h=hydro(mid);if(Math.abs(h.kg-kg)<0.0005*Math.max(1,kg))break;if(h.kg<kg)lo=mid;else hi=mid;}return {h,warn:null};}

/* ---- Lateralplan, Segelschwerpunkt, Vorlauf ---- */
function segelPoly(p){const f=p.fall*DEG,cf=Math.cos(f),sf=Math.sin(f),loc=[];let pts;
 if(+p.gaffel>0){const {T,C,Th,Pk}=gaffPts(p);pts=[T,C,Pk,Th];}else{pts=[[0,0]];for(let j=0;j<=20;j++){const v=j/20,ch=sailChord(p,v);pts.push([p.vorliek*v+ch*sf,ch*cf]);}pts.push([p.vorliek,0]);}
 for(const [y,z] of pts)loc.push([y*sf+z*cf,y*cf-z*sf]); // gekippter Rahmen → Welt: [längs nach achtern, hoch]
 let A=0,cx=0,cy=0;for(let i=0;i<loc.length;i++){const a=loc[i],b=loc[(i+1)%loc.length],cr=a[0]*b[1]-b[0]*a[1];A+=cr;cx+=(a[0]+b[0])*cr;cy+=(a[1]+b[1])*cr;}
 A/=2;return Math.abs(A)<1e-6?null:{A:Math.abs(A),x:p.x+cx/(6*A),y:p.y+cy/(6*A)};}
function lateral(zw){let A=0,Mx=0,My=0;const L=P.rumpf.L,n=120;
 for(let i=0;i<n;i++){const u=(i+0.5)/n,yk=hdims(u).Yk*1000,d=Math.max(0,zw-yk);if(d>0){const a=d*L/n;A+=a;Mx+=a*u*L;My+=a*(zw+yk)/2;}}
 for(const id in built){const p=built[id].p;if(p.typ==='profil'&&p.lage!=='waagerecht'){const m=12;for(let i=0;i<m;i++){const k=(i+0.5)/m,y=p.y-k*p.spann;if(y>=zw)continue;const ch=profChord(p,k),a=ch*p.spann/m;A+=a;Mx+=a*(p.x+profLE(p,k)+0.5*ch);My+=a*y;}}
  else if(p.typ==='bombe'&&p.y<zw){const a=0.75*p.laenge*p.durchm;A+=a;Mx+=a*p.x;My+=a*p.y;}}
 return A>0?{A,x:Mx/A,y:My/A}:null;}
function segelSP(){let A=0,Mx=0,My=0;for(const id in built){const p=built[id].p;if(p.typ!=='segel')continue;const s=segelPoly(p);if(s){A+=s.A;Mx+=s.A*s.x;My+=s.A*s.y;}}return A>0?{A,x:Mx/A,y:My/A}:null;}
const riggTeile=()=>{const ids=new Set(P.teile.filter(t=>t.typ==='segel'||(t.typ==='rohr'&&/mast|stag|want|baum|gaffel/i.test(t.name))).map(t=>t.id));let grew=true;while(grew){grew=false;for(const t of P.teile)if(t.parent&&ids.has(t.parent)&&!ids.has(t.id)){ids.add(t.id);grew=true;}}return P.teile.filter(t=>ids.has(t.id));};
function riggVerschieben(dx){for(const t of riggTeile()){t.x+=dx;if('x2' in t)t.x2+=dx;if(t.pts)t.pts.forEach(q=>q[0]+=dx);}}
function rechnenAlles(){if(!M)return null;const zw=-(+P.lage.hoehe||0),h=hydro(zw),lat=lateral(zw),ce=segelSP();const lr=h.lwl||P.rumpf.L;
 const vor=lat&&ce?{mm:lat.x-ce.x,proz:(lat.x-ce.x)/lr*100}:null;return {h,lat,ce,vor,zw};}

/* ---- Schwerpunkt-Marker im Modell ---- */
let markGrp=null;
function zeigeMarker(R){if(markGrp){disposeTree(markGrp);boat.remove(markGrp);markGrp=null;}if(!R||!RC().marker)return;markGrp=new THREE.Group();boat.add(markGrp);

/* ================= Planung: alle Funktionen aus dem NACA-Visualizer (Python) =================
   Profil-Stationen mit eigenem NACA-Code, Verjüngung, Laminatfarben, Schwertkasten, Rigg-Schnellmaße,
   Seitenriss mit Schwerpunkten, 1:1-PDF-Schablonen (gekachelt, Klebekanten, Passkreuze), Python-Projekt laden/speichern. */
const LAM_FARBEN=['#1f77b4','#d62728','#2ca02c','#9467bd','#ff7f0e','#17becf','#8c564b','#e377c2'];
function lamLagen(){let run=0;return RC().laminat.map((l,i)=>{run+=lamDicke(l);return {off:run,farbe:l.farbe||LAM_FARBEN[i%LAM_FARBEN.length],name:(l.material||'Lage')+' '+(l.gramm||'')+' g ('+(l.lagen||'')+'×)'};});}

/* ---- Profil-Stationen (die „Spanten“ von Schwert und Ruder) ---- */
function profSt(p){const S=Array.isArray(p.stationen)?p.stationen.filter(q=>q&&isNum(q.z)&&isNum(q.sehne)).slice().sort((a,b)=>a.z-b.z):[];return S.length>=2?S:null;}
const profChordLin=(p,k)=>(+p.sehneWurzel)+((+p.sehneSpitze)-(+p.sehneWurzel))*k;
const profNameStd=p=>p.naca&&nacaParse(p.naca)?p.naca:'00'+String(Math.round(+p.dicke||10)).padStart(2,'0');
function profAt(p,k){const r=profAt0(p,k),u=p.umriss&&umrissAt(p,k);if(u)r.ch=u.ch;return r;}
function profAt0(p,k){const S=profSt(p),base=nacaParse(p.naca)||{m:0,p:0,t:Math.max(0.005,(+p.dicke||10)/100)};
 if(!S)return {ch:profChordLin(p,k),N:base,te:+p.te||0};
 const z=k*(+p.spann||0);let i=0;while(i<S.length-2&&z>S[i+1].z)i++;const a=S[i],b=S[i+1],t=clamp((z-a.z)/((b.z-a.z)||1),0,1);
 const Na=nacaParse(a.naca)||base,Nb=nacaParse(b.naca)||base;
 return {ch:(+a.sehne)+((+b.sehne)-(+a.sehne))*t,N:{m:Na.m+(Nb.m-Na.m)*t,p:Na.p+(Nb.p-Na.p)*t,t:Na.t+(Nb.t-Na.t)*t},te:(+a.te||0)+((+b.te||0)-(+a.te||0))*t};}
const profLE=(p,k)=>{const u=p.umriss&&umrissAt(p,k);return u?u.le:-(+p.drehpunkt||0)/100*profAt(p,k).ch+(+p.pfeil||0)*k;}; // Vorderkante relativ zum Drehpunkt, mm (+ = achtern)
function profSchnitte(p){const sp=+p.spann||1,S=profSt(p);
 if(S)return S.map((s,i)=>{const k=clamp(s.z/sp,0,1);return {nr:i+1,k,z:+s.z,naca:s.naca||profNameStd(p),...profAt(p,k)};});
 const n=Math.max(2,+p.dxfSpanten||7);return Array.from({length:n},(_,i)=>{const k=i/(n-1);return {nr:i+1,k,z:k*sp,naca:profNameStd(p),...profAt(p,k)};});}
function stationenErzeugen(p,n){p.stationen=Array.from({length:n},(_,i)=>{const k=i/(n-1);return {z:Math.round(k*(+p.spann)*10)/10,naca:profNameStd(p),sehne:Math.round((p.umriss?profAt(p,k).ch:profChordLin(p,k))*10)/10,te:+p.te||0};});}
function stationenSync(p){const S=profSt(p);if(!S)return;p.sehneWurzel=+S[0].sehne;p.sehneSpitze=+S[S.length-1].sehne;const N=nacaParse(S[0].naca);if(N){p.naca=S[0].naca;p.dicke=Math.round(N.t*1000)/10;}}
function verjuengung(p){const S=p.stationen;if(!S||S.length<2)return;const c0=+S[0].sehne,c1=+S[S.length-1].sehne,n=S.length;S.forEach((s,i)=>{s.sehne=Math.round((c0-(c0-c1)*(i/(n-1)))*10)/10;});}

/* ---- Schwertkasten am Profil (wie im Python-Programm: Höhe, Länge, Neigung) ---- */
function kastenGeo(p){const K=p.kasten,H=(+K.hoehe)/1000,Lk=(+K.laenge)/1000,a=(+K.neigung||0)*DEG,at=profAt(p,0),cr=at.ch/1000,dp=clamp((+p.drehpunkt||0)/100,0,1);
 const w=(at.N.t*at.ch+8)/1000,zb0=profLE(p,0)/1000-(Lk-cr)/2,dy=H*Math.cos(a),dz=-H*Math.sin(a);
 const g=new THREE.BoxGeometry(w,Math.max(1e-4,dy),Math.max(1e-4,Lk));g.translate(0,dy/2,zb0+Lk/2);const pa=g.attributes.position;
 for(let i=0;i<pa.count;i++)pa.setZ(i,pa.getZ(i)+(dy>0?pa.getY(i)/dy:0)*dz);g.computeVertexNormals();return g;}

/* ---- Pläne: Linien und Texte in mm (x nach rechts, y nach oben) ---- */
const Plan=()=>({it:[]});
const plL=(pl,pts,o={})=>{if(pts&&pts.length>1)pl.it.push({k:'l',pts,c:o.c||'#000',w:o.w||0.3,d:o.d||null,z:!!o.close});};
const plT=(pl,x,y,s,o={})=>pl.it.push({k:'t',x,y,s:String(s),z:o.z||7,c:o.c||'#000',b:!!o.b,a:o.a||'left'});
const plK=(pl,cx,cy,r,o)=>{const pts=[];for(let i=0;i<=72;i++){const a=i/72*2*Math.PI;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}plL(pl,pts,o);};
const plX=(pl,x,y,r,o)=>{plL(pl,[[x-r,y],[x+r,y]],o);plL(pl,[[x,y-r],[x,y+r]],o);};
const textBreite=i=>i.s.length*i.z*0.3528*0.55;
function planBox(pl){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;const add=(x,y)=>{if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;};
 for(const i of pl.it){if(i.k==='l')for(const q of i.pts)add(q[0],q[1]);else{const w=textBreite(i),dx=i.a==='center'?w/2:i.a==='right'?w:0;add(i.x-dx,i.y-1);add(i.x-dx+w,i.y+i.z*0.3528);}}
 if(!isFinite(x0))return {x0:0,y0:0,x1:10,y1:10};return {x0,y0,x1,y1};}
const dunkelZuHell=c=>/^#(000|000000|111|111418|222)$/i.test(c)?'#e8eef0':c;
function planZeichnen(ctx,pl,W,H,hell){const b=planBox(pl),pad=10,s=Math.min((W-2*pad)/((b.x1-b.x0)||1),(H-2*pad)/((b.y1-b.y0)||1));
 const ox=pad+((W-2*pad)-(b.x1-b.x0)*s)/2,oy=pad+((H-2*pad)-(b.y1-b.y0)*s)/2,T=(X,Y)=>[ox+(X-b.x0)*s,oy+(b.y1-Y)*s],col=c=>hell?c:dunkelZuHell(c);
 for(const i of pl.it){if(i.k==='l'){ctx.beginPath();i.pts.forEach((q,j)=>{const [a,c]=T(q[0],q[1]);j?ctx.lineTo(a,c):ctx.moveTo(a,c);});if(i.z)ctx.closePath();ctx.strokeStyle=col(i.c);ctx.lineWidth=Math.max(1,i.w*s*0.9);ctx.setLineDash(i.d?i.d.map(v=>Math.max(2,v*s)):[]);ctx.stroke();}}
 ctx.setLineDash([]);for(const i of pl.it){if(i.k!=='t')continue;const [a,c]=T(i.x,i.y);ctx.fillStyle=col(i.c);ctx.font=(i.b?'600 ':'')+Math.max(9,Math.min(13,i.z*0.3528*s))+'px Barlow, sans-serif';ctx.textAlign=i.a;ctx.fillText(i.s,a,c);}ctx.textAlign='left';return s;}
function planCanvas(pl,h){if(Array.isArray(pl))pl=planStapel(pl);const c=el('canvas',{class:'edc',style:'height:'+(h||220)+'px;cursor:default','aria-label':'Zeichnung'});
 const draw=()=>{const r=c.getBoundingClientRect();if(r.width<10)return;const d=Math.min(2,devicePixelRatio||1);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);planZeichnen(x,pl,r.width,r.height,false);};
 if(window.ResizeObserver)new ResizeObserver(draw).observe(c);else requestAnimationFrame(draw);c.redraw=draw;return c;}
async function planPNG(pl,name,pxmm){if(Array.isArray(pl))pl=planStapel(pl);const b=planBox(pl),k=pxmm||8,W=Math.min(8000,Math.round((b.x1-b.x0+20)*k)),H=Math.min(8000,Math.round((b.y1-b.y0+20)*k));const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);planZeichnen(x,pl,W,H,true);

function clipSeg(x0,y0,x1,y1,xa,ya,xb,yb){let t0=0,t1=1;const dx=x1-x0,dy=y1-y0;for(const [p,q] of [[-dx,x0-xa],[dx,xb-x0],[-dy,y0-ya],[dy,yb-y0]]){if(p===0){if(q<0)return null;}else{const r=q/p;if(p<0){if(r>t1)return null;if(r>t0)t0=r;}else{if(r<t0)return null;if(r<t1)t1=r;}}}return [x0+t0*dx,y0+t0*dy,x0+t1*dx,y0+t1*dy];}

/* mehrere Pläne untereinander zu einem zusammenfassen (für SVG) */
function planStapel(list,gap){const out=Plan();let y=0;for(const q of (Array.isArray(list)?list:[list])){if(!q||!q.it.length)continue;const b=planBox(q),dy=y-b.y1;

function planSchnitte(teile){const lag=lamLagen(),kern=+RC().kern||0,MAXH=150,MAXW=262,seiten=[];let pl=null,x0=0,colH=0,colW=0;

/* Deckbucht (Wölbung des Decks über der Seitendeckskante) je Station */
function deckBucht(u,d){const Li=P.rumpf.linien;if(P.rumpf.aufmassAktiv&&Li&&Array.isArray(Li.bucht)&&Li.bucht.length)return Math.max(0,mono(Li.bucht,u*P.rumpf.L))/1000;return crown()*d.B;}

  plT(pl,0,Yk-14,'blau gestrichelt = Wasserlinie · grün = Deckkontur · grau = Mittellinie',{z:6,c:'#555555',a:'center'});seiten.push(pl);}

function segelWelt(p){const f=p.fall*DEG,cf=Math.cos(f),sf=Math.sin(f);let pts;

/* ================= Formen: freie Umrisse für Flossen, Ruder und Foils · Mast-Querschnitte · Aufbauten · Teile-Vorlagen ================= */
/* Umriss (Planform) in Teil-Koordinaten, mm: a = längs (+ = achtern, 0 = Drehpunkt), b = Spannweite.
   Senkrecht: b = 0 an der Wurzel, nach unten negativ. Waagerecht: b = 0 in der Mitte, + zur Spitze (die andere Hälfte wird gespiegelt). */
const UMR_CACHE=new WeakMap();
function umrissPoly(p){const U=p.umriss;if(!U||!Array.isArray(U.pts)||U.pts.length<3)return null;let c=UMR_CACHE.get(U.pts);if(!c){c=sampleFree(U.pts,true,!!U.glatt);UMR_CACHE.set(U.pts,c);}return c;}
function umrissNeu(p){if(p.umriss&&p.umriss.pts)UMR_CACHE.delete(p.umriss.pts);}
function umrissAt(p,k){const poly=umrissPoly(p);if(!poly)return null;const y=p.lage!=='waagerecht'?-k*(+p.spann):k*(+p.spann)/2;let lo=Infinity,hi=-Infinity;
 for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];if(a[1]===b[1])continue;if((a[1]-y)*(b[1]-y)<=0){const t=(y-a[1])/(b[1]-a[1]),x=a[0]+t*(b[0]-a[0]);if(x<lo)lo=x;if(x>hi)hi=x;}}
 if(!isFinite(lo)){let best=poly[0],bd=Infinity;for(const q of poly){const d=Math.abs(q[1]-y);if(d<bd){bd=d;best=q;}}return {le:best[0],ch:0.5};}
 return {le:lo,ch:Math.max(0.5,hi-lo)};}
function umrissSpann(p){const poly=umrissPoly(p);if(!poly)return null;const ys=poly.map(q=>q[1]);return p.lage!=='waagerecht'?Math.max(1,-Math.min(...ys)):Math.max(1,2*Math.max(...ys));}

/* Vorlagen für Umrisse. Liefert Punkte [längs, t] mit t = 0 (Wurzel/Mitte) … 1 (Spitze). */
const UMRISSE={
 trapez:{name:'Trapez (gerade Kanten)',fuer:'beide'},
 ellipse:{name:'Elliptisch (gerade 25-%-Linie)',fuer:'beide'},
 halbellipse:{name:'Halbelliptisch (gerade Hinterkante)',fuer:'senkrecht'},
 spaten:{name:'Spatenruder (runde Spitze)',fuer:'senkrecht'},
 flosse:{name:'Kielflosse gepfeilt (Marblehead)',fuer:'senkrecht'},
 moth:{name:'Moth-Ruderblatt (konstante Sehne)',fuer:'senkrecht'},
 foilgerade:{name:'Foil gerade, runde Spitzen',fuer:'waagerecht'},
 foilpfeil:{name:'Foil gepfeilt, verjüngt',fuer:'waagerecht'}};
function umrissVorlage(typ,p){const S=+p.spann||100,dp=clamp((+p.drehpunkt||0)/100,0,1);let c0=+p.sehneWurzel||S*0.2,c1=+p.sehneSpitze||c0*0.7,sw=+p.pfeil||0;
 const runde=(t,t0)=>t<=t0?1:Math.sqrt(Math.max(0,1-((t-t0)/(1-t0))**2));let ch,le,N=10,dist=i=>Math.sin(i/N*Math.PI/2);
 switch(typ){
  case 'trapez':ch=t=>c0+(c1-c0)*t;le=t=>-dp*ch(t)+sw*t;N=1;dist=i=>i;break;
  case 'ellipse':case 'foilellipse':ch=t=>c0*Math.sqrt(Math.max(0,1-t*t));le=t=>-dp*c0+0.25*(c0-ch(t))+sw*t;break;
  case 'halbellipse':ch=t=>c0*Math.sqrt(Math.max(0,1-t*t));le=t=>(1-dp)*c0+sw*t-ch(t);break;
  case 'spaten':{const b=t=>c0+(c1-c0)*t;ch=t=>b(t)*runde(t,0.82);le=t=>-dp*b(t)+sw*t+(b(t)-ch(t))*0.5;dist=i=>1-Math.pow(1-i/N,1.7);break;}
  case 'flosse':{c1=c0*0.78;if(!sw)sw=Math.round(S*0.12);const b=t=>c0+(c1-c0)*t;ch=t=>b(t)*runde(t,0.93);le=t=>-dp*b(t)+sw*t+(b(t)-ch(t))*0.5;dist=i=>1-Math.pow(1-i/N,1.7);break;}
  case 'moth':{c1=c0;sw=0;ch=t=>c0*runde(t,0.92);le=t=>-dp*c0+(c0-ch(t))*0.5;dist=i=>1-Math.pow(1-i/N,1.7);break;}
  case 'foilgerade':{c1=c0;const b=()=>c0;ch=t=>c0*runde(t,0.85);le=t=>-dp*c0+sw*t+(c0-ch(t))*0.5;dist=i=>1-Math.pow(1-i/N,1.7);break;}
  case 'foilpfeil':{c1=c0*0.5;if(!sw)sw=Math.round(c0*0.6);const b=t=>c0+(c1-c0)*t;ch=t=>b(t)*runde(t,0.9);le=t=>-dp*b(t)+sw*t+(b(t)-ch(t))*0.5;dist=i=>1-Math.pow(1-i/N,1.7);break;}
  default:return null;}
 const vk=[],hk=[];for(let i=0;i<=N;i++){const t=Math.min(dist(i),1),c=ch(t),l=le(t);vk.push([l,t]);hk.push([l+c,t]);}
 const roh=[...vk,...hk.reverse()].filter((q,i,a)=>i===0||Math.hypot(q[0]-a[i-1][0],q[1]-a[i-1][1])>1e-6);
 const vert=p.lage!=='waagerecht',r1=v=>Math.round(v*10)/10;return roh.map(([a,t])=>[r1(a),r1(vert?-t*S:t*S/2)]);}
function umrissAusForm(p){const n=8,vk=[],hk=[];for(let i=0;i<=n;i++){const k=i/n,u=p.umriss?null:1,le=profLE(p,k),ch=profAt(p,k).ch,y=p.lage!=='waagerecht'?-k*p.spann:k*p.spann/2;vk.push([Math.round(le*10)/10,Math.round(y*10)/10]);hk.push([Math.round((le+ch)*10)/10,Math.round(y*10)/10]);}return [...vk,...hk.reverse()];}

/* ---- Rohre: Mast, Baum, Bugspriet, Gestänge – Querschnitt, Verjüngung, Biegung ---- */
const QUERSCHNITTE={rund:'rund',oval:'oval',fluegel:'Flügelprofil (Flügelmast)',rechteck:'Rechteck, abgerundet'};
function rohrGeo(p,a,b){const qs=p.querschnitt||'rund',tiefe=(+p.tiefe||100)/100,spitze=clamp((p.spitze==null?100:+p.spitze)/100,0.05,3),ab=clamp((p.verjAb==null?60:+p.verjAb)/100,0,0.99),bieg=(+p.biegung||0)/1000,r=Math.max(0.0005,p.durchm/2000);
 if(qs==='rund'&&spitze===1&&!bieg)return tubeGeo(a,b,r);
 const u=b.clone().sub(a),len=Math.max(1e-4,u.length());u.multiplyScalar(1/len);let f=V(0,0,1).addScaledVector(u,-u.z);if(f.length()<0.25)f=V(0,1,0).addScaledVector(u,-u.y);f.normalize();const w=V(u.y*f.z-u.z*f.y,u.z*f.x-u.x*f.z,u.x*f.y-u.y*f.x).normalize();
 const M=qs==='fluegel'?40:24,NL=28,quer=[];
 if(qs==='fluegel'){const t=Math.min(0.4,1/Math.max(1,tiefe));for(const [x,y] of nacaLoop({m:0,p:0,t},M,0,0))quer.push([y*tiefe*2,(x-0.3)*tiefe*2]);}
 else for(let j=0;j<M;j++){const th=j/M*2*Math.PI,c=Math.cos(th),s=Math.sin(th);if(qs==='rechteck'){const e=0.3;quer.push([Math.sign(c)*Math.abs(c)**e,Math.sign(s)*Math.abs(s)**e*tiefe]);}else quer.push([c,s*(qs==='oval'?tiefe:1)]);}
 const pos=[],idx=[];for(let i=0;i<=NL;i++){const t=i/NL,sk=t<=ab?1:1-(1-spitze)*Math.pow((t-ab)/(1-ab),1.5),c=a.clone().addScaledVector(u,t*len).addScaledVector(f,bieg*Math.sin(Math.PI*t));
  for(const [qw,qf] of quer){const q=c.clone().addScaledVector(w,qw*r*sk).addScaledVector(f,qf*r*sk);pos.push(q.x,q.y,q.z);}}
 for(let i=0;i<NL;i++)for(let j=0;j<M;j++){const p0=i*M+j,p1=i*M+(j+1)%M,q0=p0+M,q1=p1+M;idx.push(p0,q0,p1,p1,q0,q1);}
 for(const i of [0,NL]){const ci=pos.length/3,c=a.clone().addScaledVector(u,i/NL*len).addScaledVector(f,bieg*Math.sin(Math.PI*i/NL));pos.push(c.x,c.y,c.z);for(let j=0;j<M;j++)idx.push(ci,i*M+j,i*M+(j+1)%M);}

/* ---- Aufbauten auf dem Deck: Kajüte, Cockpitsüll, Lukensüll ---- */
function aufbauGrund(p,n){const L2=(+p.laenge||100)/2,B2=(+p.breite||50)/2,e=0.12+0.88*clamp((p.eck==null?40:+p.eck)/100,0,1),o=[];
 for(let j=0;j<n;j++){const th=j/n*2*Math.PI,c=Math.cos(th),s=Math.sin(th);o.push([Math.sign(c)*Math.abs(c)**e*L2,Math.sign(s)*Math.abs(s)**e*B2]);}return o;} // Superellipse: e klein = Rechteck, 1 = Ellipse
function aufbauGeo(p,piv){const n=64,G=aufbauGrund(p,n),H0=+p.hoehe||20,H1=p.hoeheHinten==null?H0:+p.hoeheHinten,ne=Math.tan(clamp(+p.neigung||0,0,60)*DEG),wb=+p.woelbung||0,L2=(+p.laenge||100)/2;
 const pos=[],idx=[],add=(x,y,s)=>{const v=posOf(x,y,s).sub(piv);pos.push(v.x,v.y,v.z);return pos.length/3-1;};
 const h=xx=>H0+(H1-H0)*(xx+L2)/(2*L2),unten=[],oben=[];
 for(const [xx,ss] of G){const X=p.x+xx,S=(+p.s||0)+ss,yd=deckY(X,S)-3;unten.push(add(X,yd,S));const hh=h(xx),k=Math.max(0,1-ne*hh/Math.max(1,Math.min(L2,(+p.breite||50)/2)));oben.push([xx*k,ss*k,yd+3+hh]);}
 const top=oben.map(([xx,ss,y])=>add(p.x+xx,y,(+p.s||0)+ss));
 for(let j=0;j<n;j++){const a=unten[j],b=unten[(j+1)%n],c=top[j],d=top[(j+1)%n];idx.push(a,c,b,b,c,d);}
 if(p.dach!==false){const R=6;let prev=top;for(let r=1;r<=R;r++){const f=1-r/R,ring=oben.map(([xx,ss,y])=>add(p.x+xx*f,y+wb*(1-f*f),(+p.s||0)+ss*f));for(let j=0;j<n;j++){const a=prev[j],b=prev[(j+1)%n],c=ring[j],d=ring[(j+1)%n];idx.push(a,c,b,b,c,d);}prev=ring;}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;}

   const f=prof({name:'Höhenruder',parent:st.id,x:st.x,y:st.y-st.spann,lage:'waagerecht',achse:'x',spann:r(L*0.2),sehneWurzel:r(L*0.03),sehneSpitze:r(L*0.016),drehpunkt:50,dicke:12,naca:'2412',farbe:'#d9dde0'},'foilpfeil');neu.push(f);break;}

/* ---- Wasser im Rumpf ausblenden (sonst sieht man es durch Luken und offene Decks) ---- */
const WM={NU:64,NJ:12,tex:null,inv:new THREE.Matrix4(),dim:new THREE.Vector4(1,0.1,-0.1,0.1),an:{value:0}};
function wasserMaske(){if(!THREE.DataTexture)return;const {NU,NJ}=WM,ex=exH(),data=new Uint8Array(NU*NJ*4),L=P.rumpf.L/1000;let maxB=1e-4,y0=Infinity,y1=-Infinity;const S=[];
 for(let i=0;i<NU;i++){const u=i/(NU-1),d=hdims(u),f=secAt(u,d,ex),row=[];for(let j=0;j<NJ;j++){const t=j/(NJ-1),[x,y]=f(t);const yy=j===NJ-1?d.Ys+deckBucht(u,d)*0:y;row.push([x,yy]);maxB=Math.max(maxB,x);y0=Math.min(y0,yy);y1=Math.max(y1,yy);}S.push(row);}
 const dy=Math.max(1e-4,y1-y0);for(let i=0;i<NU;i++)for(let j=0;j<NJ;j++){const k=(j*NU+i)*4,[x,y]=S[i][j];data[k]=Math.round(clamp(x/maxB,0,1)*255);data[k+1]=Math.round(clamp((y-y0)/dy,0,1)*255);data[k+2]=0;data[k+3]=255;}
 if(!WM.tex){WM.tex=new THREE.DataTexture(data,NU,NJ,THREE.RGBAFormat);WM.tex.magFilter=WM.tex.minFilter=THREE.NearestFilter;}else WM.tex.image.data.set(data);WM.tex.needsUpdate=true;WM.dim.set(L,maxB,y0,y1);WM.an.value=1;}
if(water&&water.material){water.material.onBeforeCompile=sh=>{sh.uniforms.uHullTex={get value(){return WM.tex;}};sh.uniforms.uBoatInv={value:WM.inv};sh.uniforms.uHullDim={value:WM.dim};sh.uniforms.uHullOn=WM.an;
 sh.vertexShader='varying vec3 vWPosW;\n'+sh.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\n vWPosW=(modelMatrix*vec4(transformed,1.0)).xyz;');
 sh.fragmentShader='varying vec3 vWPosW;\nuniform sampler2D uHullTex;uniform mat4 uBoatInv;uniform vec4 uHullDim;uniform float uHullOn;\n'+
 'float hbAt(float i,float y){float px=-1.0,py=-1.0;for(int j=0;j<'+WM.NJ+';j++){vec4 t=texture2D(uHullTex,vec2((i+0.5)/'+WM.NU+'.0,(float(j)+0.5)/'+WM.NJ+'.0));float x=t.r*uHullDim.y;float yy=uHullDim.z+t.g*(uHullDim.w-uHullDim.z);if(j==0){if(y<yy)return -1.0;}else if(y<=yy){float f=(y-py)/max(1e-6,yy-py);return mix(px,x,f);}px=x;py=yy;}return -1.0;}\n'+
 'bool imRumpf(vec3 p){float u=p.z/uHullDim.x+0.5;if(u<0.0||u>1.0)return false;float fu=u*'+(WM.NU-1)+'.0;float i0=floor(fu);float w=fu-i0;float a=hbAt(i0,p.y);float b=hbAt(min(i0+1.0,'+(WM.NU-1)+'.0),p.y);if(a<0.0||b<0.0)return false;return abs(p.x)<mix(a,b,w)*0.99;}\n'+
 sh.fragmentShader.replace('void main() {','void main() {\n if(uHullOn>0.5){vec3 lp=(uBoatInv*vec4(vWPosW,1.0)).xyz;if(imRumpf(lp))discard;}');};water.material.needsUpdate=true;}
function wasserTakt(){if(!WM.tex||!boat)return;boat.updateMatrixWorld(true);WM.inv.copy(boat.matrixWorld).invert();}

const KI_REGELN=`Du bist der Konstruktions-Assistent in „Werftkoje“, einem schlanken Boots-CAD im Browser (Modellyachten wie Marblehead, Moth, Kutter). Antworte auf Deutsch, knapp und praktisch, wie ein erfahrener Bootsbauer.
KOORDINATEN (alle Maße in mm): x = Abstand vom Bug nach achtern, y = Höhe über der Wasserlinie (+ oben), s = seitlich (+ = Steuerbord, − = Backbord). Rumpflänge L steht im Kontext.
TEILE haben eine id, einen typ und Felder. Wichtige Felder je typ:
- profil (Flosse, Ruder, Schwert, Foil): x,y = Drehpunkt (Wurzel), lage 'senkrecht'|'waagerecht', spann, sehneWurzel, sehneSpitze, pfeil (mm, Pfeilung der Spitze), drehpunkt (% der Sehne), naca (z. B. '0010'), dicke (%). Hat es 'umriss', bestimmen dessen Punkte die Form; zum einfachen Skalieren dann lieber spann ändern ist NICHT möglich – stattdessen 'umriss' weglassen und Werte setzen nur wenn der Nutzer es will.
- bombe: x,y = Mitte, laenge, durchm, blei (Gewicht aus Volumen).
- rohr (Mast, Baum, Bugspriet, Stange): x,y,s = Anfang, x2,y2,s2 = Ende, durchm, querschnitt 'rund'|'oval'|'fluegel'|'rechteck', tiefe (%), spitze (% Durchmesser am Ende), verjAb (%), biegung (mm).
- kasten (Akku, Empfänger): x,y,s = Mitte, laenge, breite, hoehe, masse (g).
- servo: x,y,s, laenge, breite, hoehe, arm.
- segel: x,y = Hals, vorliek, unterliek, kopf, gaffel, rundung, fall (°).
- aufbau (Kajüte, Süll): x,s = Mitte, laenge, breite, eck (0 eckig … 100 rund), hoehe, hoeheHinten, neigung (°), woelbung, dach (bool).
- ausschnitt (Luke, Loch, Absenkung): ort 'deck'|'seite', x = Mitte, s (Deck) bzw. y (Bordwand), laenge, breite, eck, winkel, spiegel (bool), form 'std'|'frei'|'rand', tiefe (mm, >0 = abgesenkte Fläche), suell, dicke, doppler, deckel (bool). Bei form 'rand': x0, x1, abstand, bisHeck.
- Alle Teile: name, masse (g), farbe ('#rrggbb'), parent (id oder null).
Der Rumpf hat id 'rumpf' (Felder L, B, H, T, sprung, wolbung, bug, spiegel, boden, masse, offen).
VORLAGEN für neue Teile (op 'neu' mit 'vorlage'): ${'%VORLAGEN%'}.
ANTWORTFORMAT – antworte NUR mit einem JSON-Objekt:
{"antwort":"kurze Erklärung für den Nutzer (Deutsch, darf Zahlen, Gründe und Warnungen enthalten)","aenderungen":[ ... ]}
Mögliche Änderungen:
{"op":"setzen","id":"<id>","felder":{"feld":wert,...}}
{"op":"neu","vorlage":"<vorlage>","felder":{...optional...}}  oder  {"op":"neu","typ":"<typ>","felder":{...}}
{"op":"verschieben","ids":["<id>",...],"dx":0,"dy":0,"ds":0}
{"op":"spiegeln","ids":["<id>",...]}   (legt ein verbundenes Gegenstück auf der anderen Seite an)
{"op":"loeschen","id":"<id>"}
Regeln: Nutze nur ids aus dem Kontext. Ändere nur, was der Nutzer will; bei reinen Fragen oder Unklarheit ist "aenderungen" leer und du fragst nach. Beziehe dich auf die MARKIERTEN Teile, wenn der Nutzer „das“, „die“ oder „markiert“ sagt. Rechne Maße plausibel nach (Klassenregeln im Kontext beachten) und nenne in "antwort", was du geändert hast.`;
